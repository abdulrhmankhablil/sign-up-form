<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Odin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <aside class="image-panel">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 64 80" aria-hidden="true">
          <path d="M8 70V10h9l30 42V10h9v60h-9L17 28v42z" fill="currentColor"/>
        </svg>
        <span>ODIN</span>
      </div>
      <p class="photo-credit">
        Photo by <a href="https://unsplash.com/@lucabravo" target="_blank" rel="noreferrer">Luca Bravo</a>
        on <a href="https://unsplash.com/" target="_blank" rel="noreferrer">Unsplash</a>
      </p>
    </aside>

    <section class="content">
      <div class="intro">
        <p>
          This is not a real online service, but you can still make an account
          and see how a thoughtfully designed sign-up form comes together.
        </p>
        <p>Sign up now to get started.</p>
        <p class="emphasis">You know you want to.</p>
      </div>

      <form action="#" method="get">
        <div class="form-card">
          <h1>Let's do this!</h1>

          <div class="fields">
            <label>
              <span>First name</span>
              <input type="text" name="first_name" autocomplete="given-name" required>
            </label>

            <label>
              <span>Last name</span>
              <input type="text" name="last_name" autocomplete="family-name" required>
            </label>

            <label>
              <span>Email</span>
              <input type="email" name="email" autocomplete="email" required>
            </label>

            <label>
              <span>Phone number</span>
              <input type="tel" name="phone" autocomplete="tel">
            </label>

            <label>
              <span>Password</span>
              <input type="password" name="password" autocomplete="new-password" minlength="8" required>
            </label>

            <label>
              <span>Confirm password</span>
              <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Create Account</button>
          <p>Already have an account? <a href="#">Log in</a></p>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
